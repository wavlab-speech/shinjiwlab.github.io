# The current members of the lab. The file _includes/member_card.html shows
# each member as a card on the /members/ page.
#
# TO ADD A MEMBER: add an entry below. Put the photo in assets/img/.
# Do this only. Do not make a file in _data/scholar_pubs/.
# The new card comes on the page immediately. The card shows
# "No publications listed yet". The next run of bin/fetch_scholar.py makes
# the publication file for the new member.
#
# For the full procedure, and for the pull request steps, read
# docs/adding-a-member.md
#
#   id          Necessary. A unique name. The data file
#               _data/scholar_pubs/<id>.yml uses this name also.
#   name        Necessary. The card shows this name.
#   role        Necessary. This field selects the group on the page.
#               Use one of these six values:
#               faculty | postdoc | phd | master | visitor | industrial
#               CAUTION: an incorrect value removes the member from the page.
#               The build does not fail, and you get no error message.
#   scholar_id  Optional. The 12 characters from the Google Scholar address
#               (scholar.google.com/citations?user=THIS_PART). Without this
#               field, the site gets no publications. The card also shows no
#               Google Scholar link.
#   website     Optional. The address must start with http:// or https://.
#               The card removes all other addresses.
#   image       Optional. The name of a photo file in assets/img/.
#   note        Optional. The card shows this text in parentheses after the
#               name. Example: co-supervising.
#
# The sequence in each role is the sequence on the page.
#
# WHEN A MEMBER LEAVES: delete the entry below. Delete the file
# _data/scholar_pubs/<id>.yml also. Then add the member to the Alumni list in
# _pages/members.md.


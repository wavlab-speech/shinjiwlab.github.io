name: Check bibliography placeholders

# Refuses to merge a pull request while _bibliography/papers.bib still holds a
# TODO placeholder.
#
# The weekly publication job writes new papers with `abbr={TODO}`, because the
# topic is a curation choice and no tool should guess it. A person fills it in
# on the pull request. This check is what stops an unfilled entry reaching the
# site.
#
# Both placeholders reach the live site, and neither fails the build:
#   abbr={TODO}  renders a "TODO" badge next to the paper.
#   year={TODO}  is worse. jekyll-scholar drops the entry from the page and
#                says nothing, so the paper sits in papers.bib and is invisible.

on:
  pull_request:
    branches: [source, master]
    paths:
      - "_bibliography/papers.bib"

permissions:
  contents: read

jobs:
  placeholders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Look for TODO placeholders
        run: |
          python3 - <<'PY'
          import re, sys, pathlib

          text = pathlib.Path("_bibliography/papers.bib").read_text(encoding="utf-8")

          # Split on entry starts so a placeholder can be named with its key.
          bad = []
          for chunk in re.split(r"\n(?=@)", text):
              if not chunk.lstrip().startswith("@"):
                  continue
              key = re.search(r"@\w+\{([^,]+),", chunk)
              for field in re.findall(r"(\w+)\s*=\s*\{?TODO\}?", chunk):
                  bad.append((key.group(1) if key else "?", field))

          if not bad:
              print("no placeholders in papers.bib")
              sys.exit(0)

          print(f"{len(bad)} placeholder(s) still in _bibliography/papers.bib:\n")
          for key, field in bad:
              note = ("the entry disappears from the publications page"
                      if field == "year" else "shows as a TODO badge on the site")
              print(f"  {key}: {field}={{TODO}}  -- {note}")
          print("\nReplace each TODO, then push again. For `abbr`, the comment above")
          print("the entry lists the topics already used in papers.bib.")
          sys.exit(1)
          PY

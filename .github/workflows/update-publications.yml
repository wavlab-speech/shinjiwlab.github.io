name: Update Member Publications

# Refreshes the per-member files in _data/member_pubs/ from two sources: the
# lab's curated _bibliography/papers.bib, and each member's public ORCID record
# (anonymous ORCID public API, no credentials). It opens a pull request with
# the proposed changes for human review. It never pushes to a deploy branch
# directly — a maintainer reviews and merges.

on:
  schedule:
    - cron: '0 0 * * 0'   # every Sunday 00:00 UTC
  workflow_dispatch: {}    # allow manual runs from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  update-publications:
    runs-on: ubuntu-latest
    steps:
      # No `ref:` here, so a manual run on a branch tests that branch. The
      # schedule runs on the default branch, which is `source`.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      # Offline checks against a checked-in ORCID sample, before any network
      # call: a parser or matcher regression fails here, not halfway through.
      - name: Self-test
        run: python3 bin/fetch_publications.py --selftest

      # No continue-on-error. The script fails only when it sent ORCID requests
      # and every one of them failed (an ORCID outage or an API change). One
      # failed member keeps its old file, and the run stays green.
      - name: Fetch member publications
        # About one ORCID request per member, one per second.
        timeout-minutes: 10
        # -u: without it, Python buffers its output when writing to a pipe, and
        # a job killed by the timeout above loses every line it printed.
        run: python3 -u bin/fetch_publications.py

      # deploy.yml's `on: pull_request` build does not run unattended on a PR
      # opened with the default GITHUB_TOKEN: GitHub holds such runs behind an
      # "Approve workflows to run" banner that a write-access user has to click
      # (and historically suppressed them entirely). Either way the bot PR has
      # no automatic build result. So build the site here instead, before the
      # PR exists: data that breaks the build fails this run rather than
      # sitting in an unchecked PR and taking the site down once merged.
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.11'
          bundler-cache: true

      - name: Verify the site still builds with the new data
        run: bundle exec jekyll build

      # Only on `source`. A run on another branch would put that branch's code
      # into the bot pull request.
      - name: Open pull request
        if: github.ref == 'refs/heads/source'
        uses: peter-evans/create-pull-request@v6
        with:
          base: source
          branch: bot/update-member-pubs
          delete-branch: true
          add-paths: _data/member_pubs/
          commit-message: "chore: refresh member publications from papers.bib and ORCID"
          title: "Update member publications from papers.bib and ORCID"
          labels: automated
          body: |
            This pull request refreshes `_data/member_pubs/*.yml` from `_bibliography/papers.bib` and each member's public ORCID record.
            When a paper is in both, the papers.bib title, venue, year and link replace the ORCID data.
            A member whose ORCID request failed keeps the old file; the run log names that member.

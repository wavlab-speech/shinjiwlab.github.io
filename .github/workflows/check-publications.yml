name: Check publications

# Finds papers that are on Shinji's publication list but missing from
# _bibliography/papers.bib, writes them into papers.bib with `abbr={TODO}`, and
# opens ONE pull request for a person to finish.
#
# The topic tag is the only thing a person must supply. No tool should guess it,
# so the bot leaves TODO and check-bib-placeholders.yml refuses the merge until
# somebody replaces it.
#
# The branch accumulates. Each run merges source and appends only papers that
# are not already waiting, so a tag filled in last week is never overwritten.
# Closing the pull request without merging discards the drafts: the next run
# starts the branch again from source and re-proposes them.
#
# Design: docs/superpowers/specs/2026-09-04-publication-sync-design.md

on:
  schedule:
    - cron: "0 7 * * 1"   # Monday 07:00 UTC, an hour after the conferences bot
  workflow_dispatch: {}    # allow manual runs from the Actions tab

# The bot writes to its own branch and opens a pull request. It never pushes to
# source: a person merges.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: check-publications
  cancel-in-progress: false

env:
  BOT_BRANCH: bot/publications

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: source
          fetch-depth: 0          # the job merges and pushes a second branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install "beautifulsoup4>=4.12"

      # Runs against the checked-in HTML fixture. A scraper or matcher
      # regression fails here, offline, before any network call.
      - name: Self-test against the checked-in fixture
        run: python scripts/check_publications.py --selftest

      - name: Prepare the bot branch
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          pr=$(gh pr list --repo "$REPO" --head "$BOT_BRANCH" --state open \
                 --json number --jq '.[0].number // empty')

          if [ -n "$pr" ] && git ls-remote --exit-code --heads origin "$BOT_BRANCH" >/dev/null 2>&1; then
            # Keep what is there. A tag a person already filled in must survive.
            git checkout -B "$BOT_BRANCH" "origin/$BOT_BRANCH"
            git merge --no-edit origin/source
            echo "force=false" >> "$GITHUB_OUTPUT"
            echo "pr=$pr" >> "$GITHUB_OUTPUT"
          else
            # No open pull request, so nothing is waiting for a person. Start
            # again from source; a force push here discards abandoned drafts.
            git checkout -B "$BOT_BRANCH" origin/source
            echo "force=true" >> "$GITHUB_OUTPUT"
            echo "pr=" >> "$GITHUB_OUTPUT"
          fi

      # Compares the site against papers.bib ON THIS BRANCH, so a paper already
      # waiting in the pull request is not proposed twice. Exit 1 from --apply
      # means it wrote something, 0 means nothing was missing, and 2 or more is
      # a real failure that must turn the run red.
      #
      # The report runs FIRST. After --apply the papers are in papers.bib, so a
      # report taken afterwards finds nothing missing, and the pull request body
      # would say nothing is missing on the pull request that adds them.
      #
      # --apply then reads the page --report already saved, so the run makes one
      # request to the site rather than two.
      - name: Write missing publications
        id: apply
        run: |
          set +e
          python scripts/check_publications.py \
            --report "${RUNNER_TEMP}/report.md" \
            --save-fixture "${RUNNER_TEMP}/page.html"
          python scripts/check_publications.py --apply --fixture "${RUNNER_TEMP}/page.html"
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then
            echo "the checker failed with exit $code"
            exit "$code"
          fi
          if git diff --quiet -- _bibliography/papers.bib; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push and open the pull request
        if: steps.apply.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Count the entries this run added. `grep -c` over the whole file
          # would also count placeholders still waiting from earlier runs, so
          # on an accumulating branch the message would overstate the commit.
          count=$(git diff -- _bibliography/papers.bib | grep -c '^+@' || true)
          git add _bibliography/papers.bib
          git commit -m "Add ${count} publications from Shinji's list" \
                     -m "Each entry needs its abbr topic tag. The placeholder check fails until then."

          if [ "${{ steps.branch.outputs.force }}" = "true" ]; then
            git push --force origin "$BOT_BRANCH"
          else
            git push origin "$BOT_BRANCH"
          fi

          {
            echo "The weekly check found papers on"
            echo "[Shinji's publication list](https://sw005320.github.io/publications)"
            echo "that \`papers.bib\` did not have. This pull request adds them."
            echo
            echo "**Each entry needs one thing from you: the \`abbr\` topic tag.**"
            echo "The comment above each entry lists the topics already in use."
            echo "The placeholder check stays red until every TODO is gone."
            echo
            echo "Titles come from a scrape and are not authoritative. The source page"
            echo "carries 13% ALL-CAPS titles against 4% here, so check a title before"
            echo "you trust it. Link fields are left out by design: 92% of papers.bib"
            echo "has none."
            echo
            echo "This branch accumulates. A later run merges \`source\` and appends only"
            echo "new papers, so a tag you fill in here is not overwritten. Closing this"
            echo "pull request without merging discards the drafts, and the next run"
            echo "proposes them again."
            echo
            echo "<details><summary>What the checker reported</summary>"
            echo
            cat "${RUNNER_TEMP}/report.md" 2>/dev/null || echo "(report unavailable)"
            echo
            echo "</details>"
          } > "${RUNNER_TEMP}/body.md"

          number="${{ steps.branch.outputs.pr }}"
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$REPO" --body-file "${RUNNER_TEMP}/body.md"
            echo "updated pull request #$number"
          else
            gh pr create --repo "$REPO" \
              --base source --head "$BOT_BRANCH" \
              --title "Add publications missing from papers.bib" \
              --label automated \
              --body-file "${RUNNER_TEMP}/body.md"
          fi

      - name: Nothing to do
        if: steps.apply.outputs.changed == 'false'
        run: echo "every paper on the publication list is already in papers.bib"
